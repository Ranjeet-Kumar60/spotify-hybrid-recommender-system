[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hybrid_recommender_system"
version = "0.0.1"
description = "A hybrid Spotify recommender system using content and collaborative filtering"
authors = [
  { name = "Ranjeet Kumar" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["hybrid_recommender_system"]
include = ["pyproject.toml", "hybrid_recommender_system/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["hybrid_recommender_system"]
force-sort-within-sections = true

